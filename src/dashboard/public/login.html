<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DRIFT — Login</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#0d0f14;color:#e8edf5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;-webkit-font-smoothing:antialiased}
    .card{background:#141820;border:1px solid #1e2535;border-radius:14px;padding:2rem 1.75rem 1.75rem;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.4);text-align:center}
    .logo-wrap{margin-bottom:1.25rem}
    .logo-wrap img{width:160px;height:auto}
    .brand{font-size:1.4rem;font-weight:900;letter-spacing:-.04em;color:#fff;margin-bottom:.2rem}
    .tagline{font-size:.72rem;color:#4a5a72;letter-spacing:.06em;text-transform:lowercase;margin-bottom:1.5rem}
    .divider{border:none;border-top:1px solid #1e2535;margin-bottom:1.5rem}
    label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8a9bb5;display:block;margin-bottom:.35rem;text-align:left}
    input{width:100%;background:#0d0f14;border:1.5px solid #1e2535;border-radius:7px;padding:.6rem .8rem;color:#e8edf5;font-size:.9rem;outline:none;transition:border-color .15s;-webkit-appearance:none}
    input:focus{border-color:#f5a623}
    button{width:100%;margin-top:.875rem;background:#f5a623;color:#000;border:none;border-radius:7px;padding:.68rem;font-size:.875rem;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:all .15s;box-shadow:0 1px 12px rgba(245,166,35,.3)}
    button:hover{background:#ffb83d;box-shadow:0 2px 18px rgba(245,166,35,.4);transform:translateY(-1px)}
    button:active{transform:scale(.98)}
    .error{color:#e8404a;font-size:.72rem;margin-top:.65rem;display:none;background:rgba(232,64,74,.1);border:1px solid rgba(232,64,74,.3);border-radius:6px;padding:.4rem .65rem}
  </style>
</head>
<body>
  <div class="card">
    <a href="/landing" style="display:block;color:#4a5a72;font-size:0.72rem;text-decoration:none;margin-bottom:1rem;letter-spacing:0.04em">← Back</a>
    <div class="brand">DRIFT</div>
    <p class="tagline">Set it. Let it drift.</p>
    <hr class="divider"/>
    <label for="pc">Passcode</label>
    <input type="password" id="pc" placeholder="••••••••" autofocus autocomplete="current-password"/>
    <button onclick="login()">Unlock →</button>
    <p class="error" id="err">Incorrect passcode. Try again.</p>
    <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid #1e2535;text-align:center">
      <a href="/wallet-login" style="font-size:0.72rem;color:#4a5a72;text-decoration:none;transition:color .15s" onmouseover="this.style.color='#8a9bb5'" onmouseout="this.style.color='#4a5a72'">
        🔗 Sign in with Wallet instead →
      </a>
    </div>
  </div>
  <script>
    document.getElementById('pc').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
    async function login() {
      var p = document.getElementById('pc').value;
      var err = document.getElementById('err');
      err.style.display = 'none';
      try {
        var r = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({passcode: p})
        });
        if (r.ok) { window.location.href = '/dashboard'; }
        else { err.style.display = 'block'; document.getElementById('pc').value = ''; document.getElementById('pc').focus(); }
      } catch(e) { err.style.display = 'block'; }
    }
  </script>
</body>
</html>
