<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VB Signal Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Token values copied from packages/ui/src/styles/tokens.css (origin/main). Mockup only: no new tokens.
   Chart colours: actual = --accent, opposite side (what-if) = --warn-bar (validated pair, CVD dE 33), builder fee = --mh-vol-2. */
:root{
  --bg:#eef1fa;--surface:#ffffff;--surface-2:#f5f7fd;--border:#e3e7f5;--border-input:#d5dcf2;
  --ink:#141a33;--ink-2:#3b4262;--muted:#5f6684;--accent:#2e62e8;--accent-ink:#1d47b8;--accent-tint:#e6ecfe;
  --pos:#0f7a43;--pos-bg:#ddf4e7;--pos-dot:#16a05a;
  --neg:#c2312f;--neg-ink:#a72826;--neg-bg:#fde4e1;
  --warn:#7a3e00;--warn-bg:#fdebd3;--warn-border:#f0c27e;--warn-bar:#e08a2e;
  --unknown:#5a2ca0;--unknown-bg:#f0e6ff;
  --chart-bg:#f7f9ff;--mh-vol-1:#c9d6fb;--mh-vol-2:#93adf3;--mh-hatch:#e3e7f5;
  --focus-ring:#8fb0ff;
  --radius-control:12px;--radius-tile:18px;--radius-card:24px;
  --tap-min:44px;
  --shadow-accent:0 6px 16px rgb(46 98 232 / .28);
  --shadow-card:0 8px 24px rgb(20 26 51 / .07);
  --shadow-float:0 -8px 24px rgb(20 26 51 / .06);
  --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-variant-numeric:tabular-nums}
body{overflow-x:hidden}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:.92em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.neg{color:var(--neg-ink)}.pos{color:var(--pos)}.mut{color:var(--muted)}

/* Shell (same as SoDEX Debugger / Market hours) */
.shell{display:flex;gap:20px;padding:20px;align-items:flex-start;min-height:100vh}
.side{flex:0 0 236px;padding:16px 12px;border-radius:var(--radius-card);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;color:var(--ink);text-decoration:none;font-weight:800;font-size:18px}
.side .sec{padding:14px 12px 6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.side a.nav{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:600}
.side a.nav[aria-current="page"]{background:var(--accent);color:#fff;box-shadow:var(--shadow-accent)}
main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:none}

/* Header */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.head h1{margin:0;font-size:30px;font-weight:800}
.head p{margin:0}
.lede{font-size:15px;line-height:1.5;color:var(--ink-2);max-width:760px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.head .right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.btn{min-height:var(--tap-min);padding:0 16px;border-radius:var(--radius-control);border:1px solid var(--border-input);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-accent)}
.btn.icon{width:var(--tap-min);padding:0;justify-content:center}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.sample{align-self:flex-start;padding:4px 10px;border-radius:8px;background:var(--unknown-bg);color:var(--unknown);font-size:12px;font-weight:800;letter-spacing:.04em}
.past{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius-tile);background:var(--accent-tint);color:var(--accent-ink);font-size:13.5px;line-height:1.5;font-weight:600}
.past svg{flex:0 0 18px;margin-top:1px}
.past b{color:var(--ink)}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px 18px}
.card h2{margin:0;font-size:15px;font-weight:800}
.card .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin-bottom:10px}
.card .sub{font-size:12.5px;color:var(--muted);line-height:1.45;margin:2px 0 0}
.minih{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--ink)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.select{min-height:var(--tap-min);border:1px solid var(--border-input);border-radius:var(--radius-control);background:var(--surface);padding:0 34px 0 12px;font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;white-space:nowrap;position:relative;cursor:pointer}
.select::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.seg{display:inline-flex;border:1px solid var(--border-input);border-radius:var(--radius-control);padding:3px;background:var(--surface-2);gap:2px}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(20 26 51 / .12)}
.seg .cnt{font-weight:600;color:var(--muted);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 10px;min-height:30px;border-radius:999px;background:var(--accent-tint);color:var(--accent-ink);font-weight:700;font-size:12.5px}
.chip button{width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.linkbtn{background:none;border:0;color:var(--accent-ink);font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 2px}
.mfilters{display:none}

/* Summary */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:var(--radius-tile);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.01em}
.kpi .v small{font-size:13px;font-weight:700;color:var(--ink-2);margin-left:4px}
.kpi .s{font-size:12px;color:var(--muted);line-height:1.4}
.kpi.net{background:var(--neg-bg)}
.kpi.net .k{color:var(--neg-ink)}
.costs{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px 28px;margin-top:16px;align-items:start}
.cbar{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;margin-bottom:10px}
.cbar .lab{font-size:13px;font-weight:700;color:var(--ink-2);line-height:1.3}
.cbar .lab span{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.cbar .track{display:flex;gap:2px;height:30px}
.cbar .seg1{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden}
.cbar .seg1:first-child{border-radius:6px 0 0 6px}.cbar .seg1:last-child{border-radius:0 6px 6px 0}
.c-tim{background:var(--warn-bar)}.c-sx{background:var(--accent);color:#fff!important}.c-bf{background:var(--mh-vol-2)}
.c-tim.light{background:var(--warn-border)}
.cbar .tot{font-size:14px;font-weight:800;text-align:right;color:var(--neg-ink)}
.cbar .tot span{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:3px;border-radius:2px;vertical-align:3px;width:18px}
.legend i.dash{height:0;border-top:3px dashed var(--warn-bar);border-radius:0;vertical-align:3px;width:18px;background:none}
.legend i.band{background:var(--mh-vol-1)}
.takeaway{background:var(--surface-2);border-radius:var(--radius-tile);padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.takeaway b{color:var(--ink)}

/* Suggestions */
.sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sug{border:1px solid var(--border);border-radius:var(--radius-tile);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sug .top{display:flex;gap:10px;align-items:flex-start}
.sug .num{flex:0 0 26px;height:26px;border-radius:8px;background:var(--accent-tint);color:var(--accent-ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sug h3{margin:2px 0 0;font-size:14.5px;font-weight:800;line-height:1.35}
.sug p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.sug p b{color:var(--ink)}
.sug .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted);margin-top:auto;padding-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.thin{background:var(--warn-bg);color:var(--warn)}
.pill.appr{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.pill.what{background:var(--warn-bg);color:var(--warn)}
.pill.sig{background:var(--accent-tint);color:var(--accent-ink)}
.pill.bal{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.sugfoot{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5;display:flex;gap:6px;align-items:flex-start}
.sugfoot svg{flex:0 0 14px;margin-top:2px}

/* Charts */
.charts{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.chartbox{position:relative;min-width:0}
.chartbox svg{display:block}
.chartbox text{font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:10px;white-space:nowrap;box-shadow:var(--shadow-card);z-index:3}
.tip b{font-weight:800}
.mtable{width:100%;border-collapse:collapse;margin-top:10px}
.mtable th,.mtable td{font-size:12.5px;padding:6px 6px;text-align:right;white-space:nowrap}
.mtable th{font-size:11.5px;font-weight:800;color:var(--muted)}
.mtable td{border-top:1px solid var(--border)}
.mtable th:first-child,.mtable td:first-child{text-align:left;padding-left:0}
.mtable td:first-child{font-weight:700;color:var(--ink-2)}
.cfoot{font-size:12.5px;color:var(--ink-2);margin:10px 0 0;line-height:1.5}

/* Tables */
table{border-collapse:collapse;width:100%}
.tblwrap{overflow-x:auto}
.bt th{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;font-weight:800;color:var(--muted);text-align:right;padding:9px 10px;white-space:nowrap;letter-spacing:.02em;vertical-align:bottom}
.bt th span{display:block;font-weight:600;font-size:11px;letter-spacing:0}
.bt td{font-size:13px;padding:6px 10px;height:46px;border-top:1px solid var(--border);white-space:nowrap;text-align:right;vertical-align:middle}
.bt th:first-child,.bt td:first-child{text-align:left;padding-left:18px}
.bt th:last-child,.bt td:last-child{padding-right:18px}
.bt tr.all td{font-weight:800;border-top:2px solid var(--border);background:var(--surface-2)}
.bt tr.thinrow td{color:var(--muted)}
.bt tr.thinrow td:first-child{color:var(--ink-2)}
.grp{font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.div{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.div .m{position:relative;width:84px;height:8px;background:var(--surface-2);border-radius:4px;display:inline-block}
.div .m::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border-input)}
.div .m i{position:absolute;top:0;bottom:0;border-radius:3px}
.div .m i.n{right:50%;background:var(--neg)}
.div .m i.p{left:50%;background:var(--pos-dot)}
.div b{min-width:42px;text-align:right}
.btabs{display:flex;gap:2px;flex-wrap:wrap;padding:0 18px;border-bottom:1px solid var(--border)}
.btabs button{min-height:var(--tap-min);border:0;background:none;padding:0 12px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.btabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.flush{padding:0;overflow:hidden}
.flush .hrow{padding:14px 18px 12px;margin:0}
.tfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.tt td{font-size:13px;height:46px}
.tt tr.row{cursor:pointer}
.tt tr.row:hover td{background:var(--surface-2)}
.tt tr.row.sel td{background:var(--accent-tint)}
.tt tr.row.sel td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.side-l{font-weight:800}
.side-l.long{color:var(--pos)}.side-l.short{color:var(--neg-ink)}
.openbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent-ink);font-weight:700;text-decoration:underline;cursor:pointer;min-height:28px}
.mcards{display:none}

/* Drill-down dialog (BottomSheet wide: md:max-w-5xl) */
.scrim{position:fixed;inset:0;background:rgb(20 26 51 / .40);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.dialog{background:var(--surface);border-radius:var(--radius-card);width:min(1024px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgb(20 26 51 / .25);overflow:hidden}
.dialog header{padding:20px 20px 4px;display:flex;gap:12px;align-items:flex-start}
.dialog header .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dialog h2{margin:0;font-size:18px;font-weight:700}
.dialog .desc{margin:0;font-size:14px;color:var(--ink-2)}
.xbtn{flex:0 0 44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:20px;cursor:pointer;color:var(--ink)}
.dialog .body{padding:12px 20px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat strong{font-size:18px;font-weight:800}
.stat em{font-style:normal;font-size:11px;color:var(--muted)}
.panel{border-radius:12px;background:var(--surface-2);padding:10px 12px;font-size:13px}
.panel h3{margin:0 0 8px;font-size:12px;font-weight:800;color:var(--muted)}
.panel h3 .pill{margin-left:6px;vertical-align:1px}
.comp{display:grid;grid-template-columns:132px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.comp .n{color:var(--ink-2);font-weight:600;line-height:1.25}
.comp .n span{display:block;color:var(--muted);font-weight:500;font-size:11px}
.comp .b{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.comp .b i{display:block;height:100%;background:var(--accent);border-radius:3px}
.comp .b i.neu{background:var(--mh-hatch)}
.comp .v{text-align:right;font-weight:800}
.mk5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mk5>div{background:var(--surface);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.mk5 span{font-size:11px;color:var(--muted);font-weight:700}
.mk5 b{font-size:14px;font-weight:800}
.mk5 em{font-style:normal;font-size:10.5px;color:var(--muted)}
.mv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mv3>div{background:var(--surface);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.mv3 span{font-size:11px;color:var(--muted);font-weight:700}
.mv3 b{font-size:14px;font-weight:800}
.mv3 em{font-style:normal;font-size:10.5px;color:var(--muted)}
.wi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.wi .r{text-align:right;font-weight:800}
.wi .h{font-size:11.5px;font-weight:800;color:var(--muted)}
.timeline{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.timeline li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
.timeline .t{color:var(--muted)}
.timeline .x{color:var(--ink-2)}
.timeline .x.fill{color:var(--pos)}
.vers{border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}
.vers summary{cursor:pointer}

/* States */
.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px}
.empty h3{margin:0;font-size:16px;font-weight:800}
.empty p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5;max-width:380px}
.thinbanner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;font-weight:600;line-height:1.5}
.thinbanner svg{flex:0 0 18px;margin-top:2px}
.stlabel{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}

/* ---------- < 1024: no sidebar; < 768: phone ---------- */
@media (max-width:1023px){
  .side{display:none}
  .shell{padding:0;display:block}
  main{padding:12px 16px 24px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .charts{grid-template-columns:minmax(0,1fr)}
  .costs{grid-template-columns:minmax(0,1fr)}
  .desk-sample{display:none}
}
@media (max-width:767px){
  .head h1{font-size:26px}
  .lede{font-size:14px}
  .head .right{margin-left:0;width:100%;justify-content:space-between}
  .head .right .upd{display:none}
  .card{padding:14px}
  .past{padding:10px 12px;font-size:13px}
  .filters .desk-only{display:none}
  .filters{gap:8px}
  .filters .fld.time{flex:1 1 0}
  .mfilters{display:inline-flex}
  .chips .clear{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:20px}
  .kpi:first-child{grid-column:1 / -1}
  .card.flush{padding:0}
  #trades .seg{width:100%}

function drawMarkout(){
  const box = document.getElementById('mkchart'); if(!box) return;
  const w = box.clientWidth, H = w<440?220:250;
  const P = {l:40,r:w<440?52:96,t:14,b:28};
  const lo=-10, hi=5;
  const xs = i => P.l + i/(HZ.length-1)*(w-P.l-P.r);
  const y = v => P.t + (hi-v)/(hi-lo)*(H-P.t-P.b);
  const ticks=[-10,-8,-6,-4,-2,0,2,4];
  const band = MK.p75.map((v,i)=>`${xs(i)},${y(v)}`).join(' ')+' '+MK.p25.map((v,i)=>`${xs(i)},${y(v)}`).reverse().join(' ');
  const line = (arr)=>arr.map((v,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  box.innerHTML = `<svg width="${w}" height="${H}" role="img" aria-label="Markout after the fill. Actual mean ${MK.mean.map((v,i)=>HZ[i]+' '+f1(v)+' bp').join(', ')}. Opposite side mean ${MK.opp.map((v,i)=>HZ[i]+' '+f1(v)+' bp').join(', ')}.">
    <rect x="${P.l}" y="${P.t}" width="${w-P.l-P.r}" height="${H-P.t-P.b}" fill="var(--chart-bg)" rx="8"/>
    ${ticks.map(t=>`<line x1="${P.l}" x2="${w-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'var(--muted)':'var(--border)'}" stroke-width="${t===0?1.2:1}"/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t>0?'+':''}${t===0?'0':String(t).replace('-','−')}</text>`).join('')}
    <text x="${P.l-8}" y="${P.t-2}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--muted)">bp</text>
    ${HZ.map((h,i)=>`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--ink-2)" font-weight="600">${h}</text>`).join('')}
    <polygon points="${band}" fill="var(--mh-vol-1)" opacity=".75"/>
    <path d="${line(MK.opp)}" fill="none" stroke="var(--warn-bar)" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="${line(MK.mean)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
    ${MK.mean.map((v,i)=>`<circle cx="${xs(i)}" cy="${y(v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    ${MK.opp.map((v,i)=>`<circle cx="${xs(i)}" cy="${y(v)}" r="4" fill="var(--warn-bar)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    <text x="${xs(4)+10}" y="${y(MK.mean[4])+4}" font-size="12" font-weight="800" fill="var(--ink)">${f1(MK.mean[4])}${w<440?'':' actual'}</text>
    <text x="${xs(4)+10}" y="${y(MK.opp[4])-6}" font-size="12" font-weight="800" fill="var(--ink-2)">${f1(MK.opp[4])}${w<440?'':' opposite'}</text>
    ${HZ.map((h,i)=>`<rect class="hit" data-i="${i}" x="${xs(i)-(w-P.l-P.r)/8}" y="${P.t}" width="${(w-P.l-P.r)/4}" height="${H-P.t-P.b}" fill="transparent"/>`).join('')}
    <line id="mkx" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
  </svg><div class="tip" id="mktip" hidden></div>`;
  const tip = box.querySelector('#mktip'), cx = box.querySelector('#mkx');
  box.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mouseenter',()=>{const i=+r.dataset.i; cx.setAttribute('x1',xs(i)); cx.setAttribute('x2',xs(i)); cx.setAttribute('opacity',1);
      tip.hidden=false; tip.innerHTML=`<b>${HZ[i]} after the fill</b><br>Actual ${f1(MK.mean[i])} bp (middle half ${f1(MK.p25[i])} to ${f1(MK.p75[i])})<br>Behind the fill: ${MK.behind[i]}%<br>Opposite side ${f1(MK.opp[i])} bp`;
      tip.style.left=Math.min(xs(i)+10,w-230)+'px'; tip.style.top='10px';});
    r.addEventListener('mouseleave',()=>{tip.hidden=true;cx.setAttribute('opacity',0);});
  });
}

function drawMove(){
  const box = document.getElementById('mvchart'); if(!box) return;
  const rows = MOVE[WIN]; const N = rows.reduce((a,r)=>a+r[1],0);
  const w = box.clientWidth, H = w<440?230:262;
  const P = {l:40,r:8,t:22,b:46};
  const lo=-6, hi=1;
  const bw = (w-P.l-P.r)/rows.length;
  const y = v => P.t + (hi-v)/(hi-lo)*(H-P.t-P.b);
  const ticks=[-6,-4,-2,0];
  box.innerHTML = `<svg width="${w}" height="${H}" role="img" aria-label="Result before fees by move before entry over ${WIN} min. ${rows.map(r=>r[0]+': '+r[1]+' entries, '+f1(r[2])+' bp, opposite side '+f1(r[3])+' bp').join('; ')}.">
    <rect x="${P.l}" y="${P.t}" width="${w-P.l-P.r}" height="${H-P.t-P.b}" fill="var(--chart-bg)" rx="8"/>
    ${ticks.map(t=>`<line x1="${P.l}" x2="${w-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'var(--muted)':'var(--border)'}" stroke-width="${t===0?1.2:1}"/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t===0?'0':String(t).replace('-','−')}</text>`).join('')}
    <text x="${P.l-8}" y="${P.t-8}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--muted)">bp</text>
    ${rows.map((r,i)=>{const cx=P.l+bw*i+bw/2, bwi=Math.min(46,bw*0.5); const v=r[2]; const y0=y(0), y1=y(v);
      const top=Math.min(y0,y1), h=Math.max(2,Math.abs(y1-y0)); const fill=v<0?'var(--neg)':'var(--pos-dot)';
      const thin=r[1]<THIN;
      const rx = v<0?`M${cx-bwi/2},${top} h${bwi} v${h-4} a4,4 0 0 1 -4,4 h${-(bwi-8)} a4,4 0 0 1 -4,-4z`:`M${cx-bwi/2},${top+4} a4,4 0 0 1 4,-4 h${bwi-8} a4,4 0 0 1 4,4 v${h-4} h${-bwi}z`;
      return `<g><title>${r[0]}: ${r[1]} entries (${pct(r[1],N)}). Before fees ${f1(v)} bp. Opposite side ${f1(r[3])} bp.</title>
        <path d="${rx}" fill="${fill}" ${thin?'opacity=".45"':''}/>
        <text x="${cx}" y="${v<0?y1+15:y1-6}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--ink)">${f1(v)}</text>
        <circle cx="${cx+bwi/2+9}" cy="${y(r[3])}" r="5" fill="var(--warn-bar)" stroke="var(--surface)" stroke-width="2"/>
        <text x="${cx}" y="${H-28}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink-2)">${w<440?r[0].replace(' or more','+').replace(' bp',''):r[0]}</text>
        <text x="${cx}" y="${H-13}" text-anchor="middle" font-size="11" fill="var(--muted)">${r[1]} · ${pct(r[1],N)}</text></g>`;}).join('')}
  </svg>`;
  const big = rows.slice(3), rest = rows.slice(0,3);
  const nb = big.reduce((a,r)=>a+r[1],0), nr = N-nb;
  const ab = big.reduce((a,r)=>a+r[1]*r[2],0)/nb, ar = rest.reduce((a,r)=>a+r[1]*r[2],0)/nr;
  document.getElementById('mvfoot').innerHTML = `<b>4 bp or more in ${WIN} min:</b> ${nb} entries (${pct(nb,N)}), ${f1(ab)} bp before fees vs ${f1(ar)} bp for the rest. ${w<440?'Labels in bp.':'“Against” = the price had moved the other way.'}`;
}

// ---------------------------------------------------------------- render
function render(){
  const body = VIEW==='states'
    ? header + filters + statesHTML
    : header + filters + summary + suggestions + chartsShell + breakdown() + tradesHTML;
  document.getElementById('app').innerHTML = `<div class="shell">${sidebar}<main>${body}</main></div>${VIEW==='trade'?tradeDialog:''}`;
  drawMarkout(); drawMove(); drawTradeChart();
  document.querySelectorAll('#winseg button').forEach(b=>b.addEventListener('click',()=>{WIN=b.dataset.w;document.querySelectorAll('#winseg button').forEach(x=>x.setAttribute('aria-checked',x===b));drawMove();}));
  document.querySelectorAll('.btabs button').forEach(b=>b.addEventListener('click',()=>{BY=b.dataset.by;const s=document.getElementById('breakdown');s.outerHTML=breakdown();render();document.getElementById('breakdown').scrollIntoView();}));
  document.querySelectorAll('.openbtn,.mcard').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();location.search='?view=trade';}));
  document.querySelectorAll('tr.row').forEach(r=>r.addEventListener('click',()=>{location.search='?view=trade';}));
  const x=document.querySelector('.xbtn'); if(x) x.addEventListener('click',()=>{location.search='';});
}
render();
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawMarkout();drawMove();drawTradeChart();},120);});
</script>
