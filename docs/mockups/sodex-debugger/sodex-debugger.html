<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoDEX Debugger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Token values copied from packages/ui/src/styles/tokens.css (origin/main). Mockup only: no new tokens. */
:root{
  --bg:#eef1fa;--surface:#ffffff;--surface-2:#f5f7fd;--border:#e3e7f5;--border-input:#d5dcf2;
  --ink:#141a33;--ink-2:#3b4262;--muted:#5f6684;--accent:#2e62e8;--accent-ink:#1d47b8;--accent-tint:#e6ecfe;
  --pos:#0f7a43;--pos-bg:#ddf4e7;--pos-dot:#16a05a;
  --neg:#c2312f;--neg-ink:#a72826;--neg-bg:#fde4e1;
  --warn:#7a3e00;--warn-bg:#fdebd3;--warn-border:#f0c27e;--warn-bar:#e08a2e;
  --unknown:#5a2ca0;--unknown-bg:#f0e6ff;
  --focus-ring:#8fb0ff;
  --radius-control:12px;--radius-tile:18px;--radius-card:24px;
  --tap-min:44px;
  --shadow-accent:0 6px 16px rgb(46 98 232 / .28);
  --shadow-card:0 8px 24px rgb(20 26 51 / .07);
  --shadow-float:0 -8px 24px rgb(20 26 51 / .06);
  --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-variant-numeric:tabular-nums}
body{overflow-x:hidden}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:.92em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.shell{display:flex;gap:20px;padding:20px;align-items:flex-start;min-height:100vh}
.side{flex:0 0 236px;padding:16px 12px;border-radius:var(--radius-card);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;color:var(--ink);text-decoration:none;font-weight:800;font-size:18px}
.side .sec{padding:14px 12px 6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.side a.nav{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:600}
.side a.nav[aria-current="page"]{background:var(--accent);color:#fff;box-shadow:var(--shadow-accent)}
.side a.nav svg{flex:0 0 18px}
main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:none}

/* Header */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.head h1{margin:0;font-size:30px;font-weight:800}
.head p{margin:0}
.lede{font-size:15px;line-height:1.5;color:var(--ink-2);max-width:720px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.head .right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{min-height:var(--tap-min);padding:0 16px;border-radius:var(--radius-control);border:1px solid var(--border-input);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-accent)}
.btn.icon{width:var(--tap-min);padding:0;justify-content:center}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.sample{align-self:flex-start;padding:4px 10px;border-radius:8px;background:var(--unknown-bg);color:var(--unknown);font-size:12px;font-weight:800;letter-spacing:.04em}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:var(--tap-min);cursor:pointer;background:none;border:0;padding:0}
.switch .track{width:36px;height:22px;border-radius:11px;background:var(--border-input);position:relative;flex:0 0 36px}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{left:17px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px 18px}
.card h2{margin:0;font-size:15px;font-weight:800}
.card .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.select,.input{min-height:var(--tap-min);border:1px solid var(--border-input);border-radius:var(--radius-control);background:var(--surface);padding:0 34px 0 12px;font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;white-space:nowrap;position:relative;cursor:pointer}
.select::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.input{padding:0 12px 0 36px;cursor:text;color:var(--muted);font-weight:500}
.input svg{position:absolute;left:12px}
.seg{display:inline-flex;border:1px solid var(--border-input);border-radius:var(--radius-control);padding:3px;background:var(--surface-2);gap:2px}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(20 26 51 / .12)}
.seg .cnt{font-weight:600;color:var(--muted);margin-left:4px}
.slowin{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.slowin .box{min-height:36px;width:84px;border:1px solid var(--border-input);border-radius:10px;display:flex;align-items:center;padding:0 10px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 10px;min-height:30px;border-radius:999px;background:var(--accent-tint);color:var(--accent-ink);font-weight:700;font-size:12.5px}
.chip button{width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.linkbtn{background:none;border:0;color:var(--accent-ink);font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 2px}

/* Summary */
.summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.spark{display:flex;align-items:flex-end;gap:3px;height:92px;padding-top:18px;position:relative}
.spark .bar{flex:1 1 0;min-width:4px;background:var(--warn-bar);border-radius:4px 4px 0 0;position:relative;border:0;padding:0;cursor:pointer}
.spark .bar.zero{background:var(--border);height:2px!important;border-radius:2px}
.spark .bar.peak{background:var(--neg)}
.spark .peaklbl{position:absolute;top:0;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;transform:translateX(-50%)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px;border-top:1px solid var(--border);padding-top:4px}
.sumfoot{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.45}
table{border-collapse:collapse;width:100%}
.ep th{font-size:11.5px;font-weight:800;color:var(--muted);text-align:right;padding:6px 8px;letter-spacing:.02em;white-space:nowrap}
.ep th:first-child,.ep td:first-child{text-align:left;padding-left:0}
.ep td{font-size:13px;padding:7px 8px;border-top:1px solid var(--border);text-align:right;white-space:nowrap}
.ep td:first-child{white-space:normal}
.ep tr.all td{font-weight:800;border-top:2px solid var(--border)}
.rate{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.rate .meter{width:56px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-block}
.rate .meter i{display:block;height:100%;background:var(--neg);border-radius:3px}
.hi{color:var(--neg-ink);font-weight:800}
.wa{color:var(--warn);font-weight:800}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpis>div{background:var(--surface-2);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis span{font-size:12px;font-weight:700;color:var(--ink-2)}
.kpis b{font-size:18px;font-weight:800}
.minih{margin:0;font-size:13px;font-weight:800;color:var(--ink)}
/* Calls */
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.work.split{grid-template-columns:minmax(0,1fr)}
body.d-open main{margin-right:580px}
body.d-open .summary{grid-template-columns:minmax(0,1fr)}
.calls{padding:0;overflow:hidden}
.calls .hrow{padding:14px 18px 12px;margin:0}
.tblwrap{overflow-x:auto}
.ct th{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;font-weight:800;color:var(--muted);text-align:left;padding:9px 8px;white-space:nowrap;letter-spacing:.02em}
.ct td{font-size:13px;padding:5px 8px;height:44px;border-top:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.ct th:first-child,.ct td:first-child{padding-left:18px}
.ct tr.row{cursor:pointer}
.ct tr.row:hover td{background:var(--surface-2)}
.ct tr.row.sel td{background:var(--accent-tint)}
.ct tr.row.sel td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.ct .r{text-align:right}
.ct .t2{color:var(--muted);font-size:12px}
.ep-btn{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-family:var(--font-mono);font-size:12.5px;color:var(--ink);display:inline-flex;gap:6px;align-items:center;min-height:28px}
.m{display:inline-block;min-width:46px;font-weight:800;font-size:11px;letter-spacing:.03em;color:var(--ink-2)}
.m.ws{color:var(--unknown)}
.svc{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 6px}
.idc{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.tag svg{flex:0 0 12px}
.tag.ok{background:var(--pos-bg);color:var(--pos)}
.tag.rej{background:var(--neg-bg);color:var(--neg-ink)}
.tag.to{background:var(--warn-bg);color:var(--warn)}
.tag.net{background:var(--warn-bg);color:var(--warn)}
.tag.unr{background:var(--unknown-bg);color:var(--unknown)}
.lat{font-weight:600}
.lat.slow{color:var(--warn);font-weight:800}
.why{display:inline-block;vertical-align:middle;white-space:nowrap;color:var(--ink-2);font-size:12.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.kbd{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--border-input);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--ink-2)}
.retain{margin:0;display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.45;max-width:560px}.retain svg{flex:0 0 14px;margin-top:1px}

.ct tr.split .ep-btn{font-size:12px}
.ct tr.split .m{min-width:40px}
/* Detail */
.detail{padding:0;position:fixed;top:20px;right:20px;bottom:20px;width:560px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-card);z-index:5}
.detail .tabpanel{flex:1 1 auto;min-height:0}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.dtop{display:flex;align-items:flex-start;gap:10px}
.dtop h2{margin:0;font-size:16px;font-weight:800;font-family:var(--font-mono);word-break:break-all;flex:1}
.dmeta{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.expl{border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5}
.expl.unr{background:var(--unknown-bg);color:var(--unknown)}
.expl b{display:block;margin-bottom:2px}
.expl.unr span{color:var(--ink)}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--border)}
.tabs button{min-height:var(--tap-min);border:0;background:none;padding:0 12px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpanel{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sect h3{margin:0 0 6px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:132px minmax(0,1fr);gap:0;font-size:13px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.kv>div{padding:8px 10px;border-top:1px solid var(--border);min-width:0;word-break:break-all}
.kv>div:nth-child(-n+2){border-top:0}
.kv .k{background:var(--surface-2);color:var(--ink-2);font-weight:700;word-break:normal}
.kv .v{font-family:var(--font-mono);font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.redact{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px dashed var(--border-input);color:var(--ink-2);font-family:var(--font-sans);font-size:11.5px;font-weight:700;text-transform:none;letter-spacing:0}
pre.json{margin:0;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;font-family:var(--font-mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;color:var(--ink)}
.jk{color:var(--accent-ink)}.js{color:var(--pos)}.jn{color:var(--unknown)}.jerr{background:var(--neg-bg);color:var(--neg-ink);border-radius:3px;padding:0 2px}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:36px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary .chev{transform:rotate(45deg)}
.dsub{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.rel{display:flex;flex-direction:column;gap:6px}
.rel a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--ink);font-size:12.5px;min-height:44px}
.stickybar{display:none}

/* Dialog */
.scrim{position:fixed;inset:0;background:rgb(20 26 51 / .42);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.dialog{background:var(--surface);border-radius:var(--radius-card);width:min(760px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 24px 64px rgb(20 26 51 / .25)}
.dialog header{padding:18px 20px 10px;display:flex;gap:12px;align-items:flex-start}
.dialog h2{margin:0;font-size:19px;font-weight:800}
.dialog .body{padding:0 20px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);min-height:36px}
.chk .b{width:20px;height:20px;border-radius:6px;border:2px solid var(--border-input);display:inline-flex;align-items:center;justify-content:center}
.chk .b.on{background:var(--accent);border-color:var(--accent)}
pre.report{margin:0;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;font-family:var(--font-mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--ink);max-height:470px;overflow:auto}
.dialog footer{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--border);align-items:center}
.dialog footer .note{margin-right:auto}

/* States */
.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px}
.empty h3{margin:0;font-size:16px;font-weight:800}
.empty p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5;max-width:340px}
.stale{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:600}
.errbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px}

/* Mobile cards (hidden on desktop) */
.mcards{display:none}

/* ---------- < 1024: no sidebar; < 768: phone ---------- */
@media (max-width:1023px){
  .side{display:none}
  .shell{padding:0;display:block}
  main{padding:12px 16px 24px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
  body.d-open main{margin-right:0}
}
@media (max-width:767px){
  .head h1{font-size:26px}
  .lede{font-size:14px}
  .head .right{margin-left:0;width:100%;justify-content:space-between}
  .summary{grid-template-columns:minmax(0,1fr)}
  .filters .desk-only{display:none}
  .filters{gap:8px}
  .filters .fld.search{flex:1 1 100%}
  .seg{width:100%}
  .seg button{flex:1 1 0;padding:0 4px;font-size:13px}
  .seg .cnt{display:none}
  .card{padding:14px}
  .ep .hide-m{display:none}
  .ep .rate .meter{display:none}
  .ep td,.ep th{padding:6px 4px;font-size:12px}
  .ep td:first-child .mono{font-size:11.5px}
  .kbdhint{display:none}
  .epcard .collapse-m{display:none}
  .epcard .showm{display:inline-flex!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .calls .hrow{flex-direction:column}
  .tblwrap{display:none}
  .mcards{display:flex;flex-direction:column}
  .mcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--border);text-decoration:none;color:var(--ink);min-height:44px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
  .mcard .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mcard .l2{font-family:var(--font-mono);font-size:12.5px;word-break:break-all}
  .mcard .l3{font-size:12px;color:var(--ink-2)}
  .mcard .chev{grid-row:1/4;grid-column:2;align-self:center;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg)}
  .calls .hrow{padding:12px 14px 6px}
  .tfoot{padding:12px 14px}
  /* Detail becomes a full screen view */
  body.m-detail .listview{display:none!important}
  .dtop h2{font-size:14px;word-break:normal;overflow-wrap:anywhere}
  .detail{position:static;width:auto;box-shadow:none;max-height:none;border-radius:0;border:0;margin:-12px -16px 0;background:var(--surface)}
  .dhead{padding:12px 16px}
  .tabs{padding:0 8px}
  .tabs button{flex:1 1 0}
  .tabpanel{padding:14px 16px 96px}
  .kv{grid-template-columns:104px minmax(0,1fr)}

function hl(json, errMatch){
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return esc(json).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?)|\b(true|false|null)\b/g,(m,s,colon,n,b)=>{
    if(s && colon) return `<span class="jk">${s}</span>${colon}`;
    if(s){ return errMatch && s.includes(errMatch) ? `<span class="jerr">${s}</span>` : `<span class="js">${s}</span>`; }
    if(n) return `<span class="jn">${n}</span>`;
    return `<span class="jn">${b}</span>`;
  });
}
