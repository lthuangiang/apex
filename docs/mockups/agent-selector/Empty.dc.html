<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trading Agent · no bots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef1fa}
a{color:#1d47b8}a:hover{color:#141a33}
a:focus-visible,button:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
</style>
</helmet>
<div style="box-sizing: border-box; padding: 20px; background: #eef1fa; color: #141a33; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; min-height: 760px">
  <nav aria-label="App" style="flex: 0 0 236px; box-sizing: border-box; padding: 16px 12px; border-radius: 24px; background: #ffffff; border: 1px solid #e3e7f5; display: flex; flex-direction: column; gap: 2px">
    <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; color: #141a33; text-decoration: none; font-weight: 800; font-size: 18px">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.6" fill="#2E62E8"></rect><path d="M6.5 5h5.2a7 7 0 0 1 0 14H6.5z" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"></path><rect x="9.6" y="9" width="4.6" height="2" rx="1" fill="#FFFFFF"></rect><rect x="9.6" y="13" width="3.2" height="2" rx="1" fill="#FFFFFF" opacity="0.7"></rect></svg>
      DeskLabs
    </a>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
      <a href="#" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</a>
    </sc-for>
  </nav>
  <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800">Trading Agent</h1>
      <p style="margin: 0; font-size: 15px; color: #3b4262">What each bot is doing, why, and the controls to change it.</p>
    </header>
    <section aria-labelledby="empty-h" style="padding: 48px 24px; border-radius: 28px; background: #ffffff; border: 1px solid #e3e7f5; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 18px; background: #e6ecfe; color: #1d47b8; display: inline-flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M9 13h.01M15 13h.01M9 17h6"></path></svg>
      </span>
      <h2 id="empty-h" style="margin: 0; font-size: 20px; font-weight: 800">No bots yet</h2>
      <p style="margin: 0; font-size: 15px; color: #3b4262">No bots yet. Create one in Strategy Lab.</p>
      <a href="#" style="margin-top: 6px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border-radius: 12px; background: #2e62e8; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700; box-shadow: 0 6px 16px rgb(46 98 232 / .28)">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New bot</a>
    </section>
    <section aria-labelledby="only-stopped-h" style="padding: 20px; border-radius: 24px; background: #ffffff; border: 1px solid #e3e7f5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 360px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .04em; color: #5f6684">VARIANT · ONLY STOPPED BOTS</span>
        <h2 id="only-stopped-h" style="margin: 0; font-size: 17px; font-weight: 800">No bot is running</h2>
        <p style="margin: 0; font-size: 14px; color: #3b4262">You have 4 stopped bots. Open one to see what it did, or start a new one.</p>
      </div>
      <button type="button" aria-haspopup="dialog" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #d5dcf2; background: #ffffff; font: inherit; font-size: 14px; font-weight: 700; color: #141a33">Open a stopped bot</button>
      <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 12px; background: #2e62e8; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700">New bot</a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const navItems = ['Overview', 'Portfolio', 'Trading Agent', 'AI Desk', 'Strategy Lab', 'Execution & Orders', 'Risk Center', 'Settings'];
    return { nav: navItems.map(function (n) { const c = n === 'Trading Agent'; return { label: n, current: c ? 'page' : 'false', style: 'display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 14px; font-weight: ' + (c ? 700 : 500) + '; background: ' + (c ? '#2e62e8' : 'transparent') + '; color: ' + (c ? '#ffffff' : '#141a33') }; }) };
  }
}
</script>
</body>
</html>
