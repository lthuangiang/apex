<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal context</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f7fd}
a{color:#1d47b8}a:hover{color:#141a33}
</style>
<script>window.DC_PROPS = {"$preview":{"width":1440,"height":1500}};</script>
<script src="./dc-shim.js"></script>
<script>
window.Component = class Component extends DCLogic {
  renderVals() { return {}; }
}

</script>
</head>
<body>
<template id="dc-tpl">

<div style="box-sizing: border-box; width: 100%; max-width: 1440px; margin: 0 auto; padding: 32px 24px 48px; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; color: #141a33; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800">Signal Analysis</h1>
    <p style="margin: 0; font-size: 14px; color: #5f6684">Signal research tab · new section under "Where each signal type stands". Team only.</p>
  </div>

  <section aria-labelledby="ctx" style="background: #fff; border: 1px solid #e3e7f5; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 820px">
        <h2 id="ctx" style="margin: 0; font-size: 20px; font-weight: 800">Does context make news signals better?</h2>
        <p style="margin: 0; font-size: 13px; color: #3b4262; line-height: 1.5">News is the only thing that opens a trade. For every news signal we also save three facts about the market at that moment, then compare trades with and without each one. Nothing here changes what the bot does yet.</p>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
        <span style="font-size: 12px; font-weight: 700; color: #5f6684">Baseline (v3) · from the page's version picker</span>
        <div role="group" aria-label="Data" style="display: flex; gap: 4px; background: #f5f7fd; border: 1px solid #e3e7f5; border-radius: 10px; padding: 3px; align-self: flex-end">
          <button type="button" aria-pressed="true" style="min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #fff; font: inherit; font-size: 13px; font-weight: 800; box-shadow: 0 1px 3px rgba(20,26,51,.15)">Live</button>
          <button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; font-weight: 800; color: #5f6684">Backfilled</button>
        </div>
      </div>
    </div>

    <div style="padding: 12px 16px; border-radius: 12px; background: #fdebd3; color: #7a3e00; font-size: 13px; line-height: 1.5">
      <strong>Slower than the main gate.</strong> At about 30 news trades a week, each group below gets 10 to 15. A group needs 30 closed trades before it is compared, so expect the first answer in roughly 3 to 6 weeks.
    </div>

    <div style="overflow-x: auto; border: 1px solid #e3e7f5; border-radius: 12px">
      <table style="width: 100%; min-width: 980px; border-collapse: collapse; font-size: 13px">
        <thead>
          <tr style="background: #f5f7fd; color: #3b4262; text-align: left">
            <th scope="col" style="padding: 10px 12px; width: 26%">Question, fixed in advance</th>
            <th scope="col" style="padding: 10px 12px">Group</th>
            <th scope="col" style="padding: 10px 12px">Closed</th>
            <th scope="col" style="padding: 10px 12px">Average after fees</th>
            <th scope="col" style="padding: 10px 12px">Difference (with − without)</th>
            <th scope="col" style="padding: 10px 12px">Likely range</th>
            <th scope="col" style="padding: 10px 12px">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr style="border-top: 1px solid #e3e7f5">
            <td rowspan="2" style="padding: 12px; vertical-align: top"><strong>H1 · Whales agree</strong><br><span style="color: #5f6684">At least one research wallet (top 30 of the leaderboard, already on it before then) opened or added a position in the same direction on that asset in the 60 min before the decision.</span></td>
            <td style="padding: 12px"><span style="padding: 3px 8px; border-radius: 999px; background: #ddf4e7; color: #0f7a43; font-weight: 700; font-size: 12px">With</span></td>
            <td style="padding: 12px">12</td>
            <td style="padding: 12px">Not enough trades</td>
            <td rowspan="2" style="padding: 12px; vertical-align: top">Not enough trades to compare</td>
            <td rowspan="2" style="padding: 12px; vertical-align: top">—</td>
            <td rowspan="2" style="padding: 12px; vertical-align: top"><span style="padding: 3px 8px; border-radius: 999px; background: #fdebd3; color: #7a3e00; font-weight: 700; font-size: 12px">Collecting</span><br><span style="font-size: 12px; color: #5f6684">18 more with · 9 more without</span></td>
          </tr>
          <tr style="border-top: 1px solid #eef1fa">
            <td style="padding: 12px"><span style="padding: 3px 8px; border-radius: 999px; background: #eef1fa; color: #3b4262; font-weight: 700; font-size: 12px">Without</span></td>
            <td style="padding: 12px">21</td>
            <td style="padding: 12px">Not enough trades</td>
          </tr>
          <tr style="border-top: 1px solid #e3e7f5">
            <td rowspan="2" style="padding: 12px; vertical-align: top"><strong>H2 · Funding against the crowd</strong><br><span style="color: #5f6684">Long when funding is in the lowest 20% of the last 30 days, or Short when it is in the highest 20%.</span></td>
            <td style="padding: 12px"><span style="padding: 3px 8px; border-radius: 999px; background: #ddf4e7; color: #0f7a43; font-weight: 700; font-size: 12px">With</span></td>
            <td style="padding: 12px">34</td>
            <td style="padding: 12px">+0.21%</td>
            <td rowspan="2" style="padding: 12px; vertical-align: top"><strong>+0.17%</strong></td>
            <td rowspan="2" style="padding: 12px; vertical-align: top">−0.06% to +0.41%</td>
            <td rowspan="2" style="padding: 12px; vertical-align: top"><span style="padding: 3px 8px; border-radius: 999px; background: #eef1fa; color: #3b4262; font-weight: 700; font-size: 12px">No clear difference</span><br><span style="font-size: 12px; color: #5f6684">The range still includes 0</span></td>
          </tr>
          <tr style="border-top: 1px solid #eef1fa">
            <td style="padding: 12px"><span style="padding: 3px 8px; border-radius: 999px; background: #eef1fa; color: #3b4262; font-weight: 700; font-size: 12px">Without</span></td>
            <td style="padding: 12px">41</td>
            <td style="padding: 12px">+0.04%</td>
          </tr>
          <tr style="border-top: 1px solid #e3e7f5">
            <td rowspan="2" style="padding: 12px; vertical-align: top"><strong>H3 · Price already moved</strong><br><span style="color: #5f6684">Before entry the price had moved at least one typical 1-hour move in the signal's direction, so we may be late.</span></td>
            <td style="padding: 12px"><span style="padding: 3px 8px; border-radius: 999px; background: #ddf4e7; color: #0f7a43; font-weight: 700; font-size: 12px">With</span></td>
            <td style="padding: 12px">31</td>
            <td style="padding: 12px">−0.32%</td>
            <td rowspan="2" style="padding: 12px; vertical-align: top"><strong>−0.41%</strong></td>
            <td rowspan="2" style="padding: 12px; vertical-align: top">−0.70% to −0.12%</td>
            <td rowspan="2" style="padding: 12px; vertical-align: top"><span style="padding: 3px 8px; border-radius: 999px; background: #fde4e1; color: #a72826; font-weight: 700; font-size: 12px">Worse with it</span><br><span style="font-size: 12px; color: #5f6684">Candidate option: "Skip if price already moved"</span></td>
          </tr>
          <tr style="border-top: 1px solid #eef1fa">
            <td style="padding: 12px"><span style="padding: 3px 8px; border-radius: 999px; background: #eef1fa; color: #3b4262; font-weight: 700; font-size: 12px">Without</span></td>
            <td style="padding: 12px">44</td>
            <td style="padding: 12px">+0.09%</td>
          </tr>
        </tbody>
      </table>
    </div>
    <p style="margin: 0; font-size: 12px; color: #5f6684; line-height: 1.5">Sample numbers for the layout. Average after fees per trade, as a % of size. Likely range: 95% by day blocks. A question gets a verdict only when both groups have 30 or more closed trades. Only these three questions can become a version option; their thresholds do not change after the fact. H1 "Without" counts only signals on assets with whale data; assets without whale data are left out of both groups (shown under Coverage), so "unknown" is never mixed with "no".</p>

    <div style="display: flex; flex-wrap: wrap; gap: 12px">
      <div style="flex: 1 1 320px; border: 1px solid #e3e7f5; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; font-weight: 800">What turns a question into an option</div>
        <p style="margin: 0; font-size: 13px; color: #3b4262; line-height: 1.5">The whole likely range is on one side of 0, with 30+ closed trades in each group. Then the team can save a version with that option (for example "Skip if price already moved") and A/B it against Baseline. With three questions, one can look good by luck, so an option still has to beat Baseline in an A/B before it counts.</p>
      </div>
      <div style="flex: 1 1 320px; border: 1px solid #e3e7f5; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; font-weight: 800">Coverage</div>
        <p style="margin: 0; font-size: 13px; color: #3b4262; line-height: 1.5">Whale data: 41 of 75 signals (assets not on Hyperliquid, or with no research wallet read in the hour before, show "Not available"). Funding: 75 of 75. Price run: 75 of 75. Open interest: not available on SoDEX, not used.</p>
      </div>
    </div>

    <details style="border: 1px dashed #d5dcf2; border-radius: 14px; padding: 12px 16px">
      <summary style="cursor: pointer; font-size: 14px; font-weight: 800; min-height: 32px; display: flex; align-items: center">Exploratory · other measures we save (not used for options)</summary>
      <p style="margin: 8px 0 0; font-size: 13px; color: #3b4262; line-height: 1.5">Whale size in USDC, number of agreeing wallets, funding value, volume vs 24 h average, range breakout, volatility squeeze. Looking at many measures will always find one that looks good by luck, so these stay here for ideas only.</p>
    </details>
  </section>
</div>
</template>
<div id="dc-root"></div>
</body>
</html>
