<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context step effects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f7fd}
.whale{animation:whale 1.1s cubic-bezier(.3,.7,.3,1) both}
@keyframes whale{0%{transform:translate(-90px,40px) rotate(-25deg);opacity:0}45%{transform:translate(0,-34px) rotate(10deg);opacity:1}70%{transform:translate(8px,6px) rotate(18deg)}100%{transform:translate(10px,4px) rotate(0);opacity:1}}
.ripple{animation:ripple .8s ease-out .4s both}
@keyframes ripple{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.drop{animation:drop .6s ease-out .5s both}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.tip{animation:tip 1s cubic-bezier(.5,1.6,.4,1) .1s both;transform-origin:50% 100%}
@keyframes tip{0%{transform:rotate(0)}100%{transform:rotate(var(--tip))}}
.crowd{animation:crowd 1s ease .1s both}
@keyframes crowd{0%{transform:translateX(0)}100%{transform:translateX(-6px)}}
.run{animation:run .9s cubic-bezier(.2,.8,.2,1) .1s both}
@keyframes run{0%{stroke-dashoffset:120}100%{stroke-dashoffset:0}}
.late{animation:late .3s ease .9s both}
@keyframes late{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1) .8s both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.scan{animation:scan 1.1s ease-in-out both}
@keyframes scan{0%{left:-70px}100%{left:100%}}
.calm{animation:calm 1.1s ease-in-out both}
@keyframes calm{0%{transform:scaleX(.3);opacity:0}60%{transform:scaleX(1.1);opacity:1}100%{transform:scaleX(1);opacity:.6}}
.away{animation:away 1.1s ease-in both}
@keyframes away{0%{transform:translateX(0);opacity:1}100%{transform:translateX(70px);opacity:.35}}
.wobble{animation:wobble 1s ease-out both;transform-origin:50% 100%}
@keyframes wobble{0%{transform:rotate(0)}25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
.sonar{animation:sonar 1.1s ease-out both}
.sonar2{animation:sonar 1.1s ease-out .35s both}
@keyframes sonar{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1);opacity:0}}
.swim{animation:swim 2.6s ease-in-out both}
.swim2{animation:swim2 2.6s ease-in-out .2s both}
@keyframes swim{0%{transform:translateX(-40px);opacity:0}20%{opacity:.55}100%{transform:translateX(60px);opacity:.55}}
@keyframes swim2{0%{transform:translateX(40px) scaleX(-1);opacity:0}20%{opacity:.4}100%{transform:translateX(-50px) scaleX(-1);opacity:.4}}
@media (prefers-reduced-motion: reduce){.swim,.swim2{animation:none;opacity:.45}.sonar,.sonar2{animation:none;opacity:.35}.whale,.ripple,.drop,.tip,.crowd,.run,.late,.pop,.scan,.calm,.away,.wobble{animation:none}}
</style>
<script>window.DC_PROPS = {"$preview":{"width":1440,"height":760}};</script>
<script src="./dc-shim.js"></script>
<script>
window.Component = class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: 'all', k: 0 }; }
  renderVals() {
    const c = this.state.c;
    const set = { all: [1, 1, 1], whale: [1, 0, 0], none: [0, 0, 0], late: [0, 0, 1], against: [0, 0, 0], na: [0, 0, 0] }[c];
    const h1mode = c === 'against' ? 'against' : c === 'na' ? 'na' : set[0] ? 'yes' : 'no';
    const pill = (y, warn) => 'padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: ' + (y ? (warn ? '#fdebd3' : '#e6ecfe') : '#eef1fa') + '; color: ' + (y ? (warn ? '#7a3e00' : '#1d47b8') : '#5f6684');
    const card = (y) => 'background: #fff; border: ' + (y ? '2px solid #2e62e8' : '1px solid #e3e7f5') + '; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px';
    const k = this.state.k;
    const cases = [['all', 'All three yes'], ['whale', 'Whales only'], ['late', 'Price ran early'], ['none', 'All no'], ['against', 'Whales disagree'], ['na', 'No whale data']].map(([id, label]) => ({
      label, pressed: String(c === id),
      pick: () => this.setState({ c: id, k: k + 1 }),
      style: 'min-height: 40px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; border: 1px solid ' + (c === id ? '#2e62e8' : '#d5dcf2') + '; background: ' + (c === id ? '#2e62e8' : '#fff') + '; color: ' + (c === id ? '#fff' : '#141a33')
    }));
    const [w, f, r] = set;
    return {
      cases,
      h1: { yes: h1mode === 'yes', no: h1mode === 'no', against: h1mode === 'against', na: h1mode === 'na', tag: { yes: 'Yes', no: 'No', against: 'Disagree', na: 'Not available' }[h1mode], pill: pill(h1mode === 'yes'), card: card(h1mode === 'yes'), text: { yes: '2 tracked wallets added Short ETH in the 60 min before · $1.4M · first at 09:41', no: 'Checked 12 tracked wallets: none traded ETH in the 60 min before.', against: '1 tracked wallet added Long ETH ($0.8M) in the 60 min before, the other way from this Short signal.', na: 'This asset is not on Hyperliquid, or no tracked wallet has data, so there is no whale data. The signal is left out of the H1 comparison.' }[h1mode] },
      h2: { yes: !!f, no: !f, tag: f ? 'Yes' : 'No', pill: pill(f), card: card(f), tipCls: f ? 'tip' : 'wobble', angle: f ? '-8deg' : '0deg', text: f ? 'Funding 0.042% per 8 h, 92nd percentile of 30 days: longs are crowded, this signal is Short.' : 'Funding 0.010% per 8 h, 56th percentile: no crowd to lean against.' },
      h3: { yes: !!r, no: !r, tag: r ? 'Yes · warning' : 'No', pill: pill(r, true), card: card(r), pre: 'M10 52 L60 48 L100 50 L130 46', path: r ? 'M130 46 L160 78 L190 108' : 'M130 46 L160 50 L190 54', runCls: 'run', color: r ? '#b45f06' : '#2e62e8', text: r ? 'Price fell 0.9% in the signal direction before entry; a typical 1-hour move is 0.6%.' : 'Price moved 0.2% before entry; a typical 1-hour move is 0.6%.' },
      mini: { whale: h1mode === 'yes' ? '#1d47b8' : h1mode === 'na' ? '#eef1fa' : '#c9d4ff', scale: f ? '#141a33' : '#c9d4ff', run: r ? '#b45f06' : '#c9d4ff', text: (w + f + r) + ' of 3 yes' }
    };
  }
}

</script>
</head>
<body>
<template id="dc-tpl">

<div style="width: 1440px; box-sizing: border-box; padding: 28px 24px; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; color: #141a33; background: #f5f7fd; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap">
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Step 4 · Context: what plays when the article reaches it</h1>
      <p style="margin: 4px 0 0; font-size: 13px; color: #5f6684">Each animation only plays when the saved answer is Yes. A No plays a short calm version (scan, wobble, "on time") so you can see it was checked; "Not available" is a dashed empty box. Reduced motion shows the end frame.</p>
    </div>
    <div role="group" aria-label="Example" style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{cases}}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">

    <article style="{{h1.card}}">
      <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 14px">H1 · Whales agree</strong><span style="{{h1.pill}}">{{h1.tag}}</span></div>
      <div aria-hidden="true" style="position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: #e6ecfe">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: #c9d4ff"></div>
        <sc-if value="{{h1.yes}}" hint-placeholder-val="{{true}}">
          <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0">
            <div class="ripple" style="position: absolute; left: 50%; top: 94px; width: 60px; height: 14px; margin-left: -30px; border: 2px solid #2e62e8; border-radius: 50%"></div>
            <div class="drop" style="position: absolute; left: 44%; top: 86px; width: 6px; height: 6px; border-radius: 50%; background: #2e62e8"></div>
            <div class="drop" style="position: absolute; left: 56%; top: 84px; width: 5px; height: 5px; border-radius: 50%; background: #2e62e8"></div>
            <svg class="whale" width="120" height="70" viewBox="0 0 120 70" style="position: absolute; left: 50%; top: 40px; margin-left: -60px"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#1d47b8"></path><circle cx="34" cy="36" r="3" fill="#fff"></circle><path d="M44 18c-2-6 0-12 4-14M44 18c0-7 4-11 9-12M44 18c2-6 7-8 12-7" stroke="#7fa2ff" stroke-width="3" fill="none" stroke-linecap="round"></path><path d="M30 46c8 4 20 5 30 2" stroke="#c9d4ff" stroke-width="3" fill="none" stroke-linecap="round"></path></svg>
            <span class="pop" style="position: absolute; right: 12px; top: 12px; padding: 4px 10px; border-radius: 999px; background: #fff; color: #1d47b8; font-size: 13px; font-weight: 800">+$1.4M Short</span>
          </div>
        </sc-if>
        <sc-if value="{{h1.no}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0">
            <div class="scan" style="position: absolute; top: 0; bottom: 0; width: 70px; background: linear-gradient(90deg, rgba(46,98,232,0), rgba(46,98,232,.22), rgba(46,98,232,0))"></div><div class="sonar" style="position: absolute; left: 50%; top: 60px; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid #2e62e8; border-radius: 50%"></div><div class="sonar2" style="position: absolute; left: 50%; top: 60px; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid #2e62e8; border-radius: 50%"></div><div style="position: absolute; left: 50%; top: 60px; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #2e62e8"></div>
            <div class="calm" style="position: absolute; left: 30%; top: 96px; width: 40%; height: 3px; border-radius: 2px; background: #7fa2ff"></div>
            <svg class="swim" width="46" height="27" viewBox="0 0 120 70" style="position: absolute; left: 22%; top: 112px"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#2e62e8"></path></svg><svg class="swim2" width="34" height="20" viewBox="0 0 120 70" style="position: absolute; left: 62%; top: 126px"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#2e62e8"></path></svg><span class="pop" style="position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 999px; background: #fff; color: #3b4262; font-size: 12px; font-weight: 800">Scanned 12 wallets · quiet</span>
          </div>
        </sc-if>
        <sc-if value="{{h1.against}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0">
            <svg class="away" width="120" height="70" viewBox="0 0 120 70" style="position: absolute; left: 50%; top: 52px; margin-left: -60px"><g transform="translate(120 0) scale(-1 1)"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#5f6684"></path></g></svg>
            <span class="pop" style="position: absolute; right: 12px; top: 12px; padding: 4px 10px; border-radius: 999px; background: #fff; color: #3b4262; font-size: 12px; font-weight: 800">$0.8M went Long · opposite</span>
          </div>
        </sc-if>
        <sc-if value="{{h1.na}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 12px; right: 12px; top: 12px; bottom: 12px; border: 2px dashed #d5dcf2; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #f5f7fd">
            <span class="pop" style="padding: 4px 10px; border-radius: 999px; background: #fff; color: #5f6684; font-size: 12px; font-weight: 800">No whale data for this asset</span>
          </div>
        </sc-if>
      </div>
      <p style="margin: 0; font-size: 13px; color: #3b4262; line-height: 1.5">{{h1.text}}</p>
      <p style="margin: 0; font-size: 12px; color: #5f6684">A whale jumps in only when a wallet DeskLabs tracks (followed, and already on the leaderboard before then) opened or added the same direction on this asset in the 60 min before. The tag shows the real size. No: a scan sweeps the water and shows how many wallets were checked. Opposite direction: a grey whale swims away, "Disagree". Asset not on Hyperliquid, or no tracked wallet: dashed empty box, "Not available", left out of the comparison.</p>
    </article>

    <article style="{{h2.card}}">
      <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 14px">H2 · Funding against the crowd</strong><span style="{{h2.pill}}">{{h2.tag}}</span></div>
      <div aria-hidden="true" style="position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: #f5f7fd; border: 1px solid #e3e7f5">
        <div style="position: absolute; left: 50%; bottom: 22px; width: 0; height: 0; margin-left: -12px; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 22px solid #3b4262"></div>
        <div class="{{h2.tipCls}}" style="position: absolute; left: 50%; bottom: 44px; width: 220px; margin-left: -110px; height: 6px; border-radius: 3px; background: #141a33; --tip: {{h2.angle}}">
          <div class="crowd" style="position: absolute; left: 4px; bottom: 6px; display: flex; gap: 3px">
            <span style="width: 12px; height: 18px; border-radius: 6px 6px 2px 2px; background: #a72826"></span><span style="width: 12px; height: 18px; border-radius: 6px 6px 2px 2px; background: #a72826"></span><span style="width: 12px; height: 18px; border-radius: 6px 6px 2px 2px; background: #a72826"></span><span style="width: 12px; height: 18px; border-radius: 6px 6px 2px 2px; background: #a72826"></span><span style="width: 12px; height: 18px; border-radius: 6px 6px 2px 2px; background: #a72826"></span>
          </div>
          <span style="position: absolute; right: 6px; bottom: 6px; width: 16px; height: 22px; border-radius: 8px 8px 2px 2px; background: #2e62e8"></span>
        </div>
        <span style="position: absolute; left: 12px; top: 10px; font-size: 12px; font-weight: 700; color: #a72826">Crowd: Long</span>
        <span style="position: absolute; right: 12px; top: 10px; font-size: 12px; font-weight: 700; color: #1d47b8">This signal: Short</span>
        <sc-if value="{{h2.no}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center"><span class="pop" style="padding: 3px 10px; border-radius: 999px; background: #fff; border: 1px solid #e3e7f5; color: #3b4262; font-size: 12px; font-weight: 800; white-space: nowrap">Funding 56th percentile · no crowd to lean on</span></div>
        </sc-if>
        <sc-if value="{{h2.yes}}" hint-placeholder-val="{{true}}">
          <div style="position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center"><span class="pop" style="padding: 3px 10px; border-radius: 999px; background: #fff; border: 1px solid #e3e7f5; color: #141a33; font-size: 12px; font-weight: 800; white-space: nowrap">Funding 92nd percentile · longs pay</span></div>
        </sc-if>
      </div>
      <p style="margin: 0; font-size: 13px; color: #3b4262; line-height: 1.5">{{h2.text}}</p>
      <p style="margin: 0; font-size: 12px; color: #5f6684">The see-saw tips only when funding is in the top or bottom 20% of 30 days and the signal goes the other way from the side paying. Otherwise it stays level and grey.</p>
    </article>

    <article style="{{h3.card}}">
      <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 14px">H3 · Price already moved</strong><span style="{{h3.pill}}">{{h3.tag}}</span></div>
      <div aria-hidden="true" style="position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: #f5f7fd; border: 1px solid #e3e7f5">
        <svg width="100%" height="150" viewBox="0 0 300 150" preserveAspectRatio="none" style="position: absolute; inset: 0">
          <line x1="190" y1="10" x2="190" y2="140" stroke="#5f6684" stroke-width="2" stroke-dasharray="4 4"></line>
          <path d="{{h3.pre}}" stroke="#5f6684" stroke-width="3" fill="none" stroke-linecap="round"></path>
          <path class="{{h3.runCls}}" d="{{h3.path}}" stroke="{{h3.color}}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="0"></path>
        </svg>
        <span style="position: absolute; left: 63%; top: 8px; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: #5f6684">Entry</span>
        <sc-if value="{{h3.yes}}" hint-placeholder-val="{{true}}">
          <span class="late" style="position: absolute; left: 50%; top: 40px; padding: 3px 10px; border-radius: 999px; background: #fdebd3; color: #7a3e00; font-size: 12px; font-weight: 800">Already ran −0.9% · late?</span>
        </sc-if>
        <sc-if value="{{h3.no}}" hint-placeholder-val="{{false}}">
          <span class="pop" style="position: absolute; left: 50%; top: 78px; padding: 3px 10px; border-radius: 999px; background: #eef1fa; color: #3b4262; font-size: 12px; font-weight: 800">+0.2% before entry · on time</span>
        </sc-if>
      </div>
      <p style="margin: 0; font-size: 13px; color: #3b4262; line-height: 1.5">{{h3.text}}</p>
      <p style="margin: 0; font-size: 12px; color: #5f6684">The line runs to the entry mark in the signal's direction and turns amber only when the move before entry is at least one typical 1-hour move in the signal's direction. This one is a warning, so it never celebrates.</p>
    </article>
  </div>

  <div style="background: #fff; border: 1px solid #e3e7f5; border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
    <strong style="font-size: 14px">In the funnel</strong>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 2px dashed #2e62e8; border-radius: 8px; background: #fff; font-size: 13px; font-weight: 800">
      <span>4 · Context</span>
      <svg aria-hidden="true" width="26" height="16" viewBox="0 0 120 70"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="{{mini.whale}}"></path></svg>
      <svg aria-hidden="true" width="22" height="16" viewBox="0 0 22 16"><path d="M1 12 L21 6" stroke="{{mini.scale}}" stroke-width="3" stroke-linecap="round"></path><path d="M11 9 L8 15 L14 15 Z" fill="{{mini.scale}}"></path></svg>
      <svg aria-hidden="true" width="22" height="16" viewBox="0 0 22 16"><path d="M1 2 L8 4 L13 9 L21 14" stroke="{{mini.run}}" stroke-width="3" fill="none" stroke-linecap="round"></path></svg>
      <span style="font-weight: 700; color: #3b4262">{{mini.text}}</span>
    </div>
    <span style="font-size: 12px; color: #5f6684; flex: 1; min-width: 260px">While the chip passes step 4 the three small icons light up for each Yes, then the cards above open below the funnel like the other steps. Each effect plays once, under 1.2 s, when the chip passes step 4; scrolling never replays it, only the Replay button does. In totals mode the band shows counts only, no animation.</span>
  </div>
</div>
</template>
<div id="dc-root"></div>
</body>
</html>
