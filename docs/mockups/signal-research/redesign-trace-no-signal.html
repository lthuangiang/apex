<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live trace, no context signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f7fd}
a{color:#1d47b8}
.news{transition:background .2s,border-color .2s,transform .2s}
.news:hover{transform:translateX(3px);border-color:#2e62e8}
.token{transition:top .7s cubic-bezier(.65,0,.35,1),left .5s cubic-bezier(.65,0,.35,1),transform .5s,background .3s,color .3s,border-color .3s,opacity .3s}
.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,98,232,.5)}50%{box-shadow:0 0 0 8px rgba(46,98,232,0)}}
.reveal{animation:reveal .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.whale{animation:whale 1.1s cubic-bezier(.3,.7,.3,1) both}
@keyframes whale{0%{transform:translate(-70px,34px) rotate(-25deg);opacity:0}45%{transform:translate(0,-26px) rotate(10deg);opacity:1}70%{transform:translate(6px,4px) rotate(16deg)}100%{transform:translate(8px,2px) rotate(0);opacity:1}}
.ripple{animation:ripple .8s ease-out .4s both}
@keyframes ripple{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.scan{animation:scan 1.1s ease-in-out both}
@keyframes scan{0%{left:-60px}100%{left:100%}}
.away{animation:away 1.1s ease-in both}
@keyframes away{0%{transform:translateX(0);opacity:1}100%{transform:translateX(50px);opacity:.35}}
.tip{animation:tip 1s cubic-bezier(.5,1.6,.4,1) .1s both;transform-origin:50% 100%}
@keyframes tip{0%{transform:rotate(0)}100%{transform:rotate(var(--tip))}}
.wobble{animation:wobble 1s ease-out both;transform-origin:50% 100%}
@keyframes wobble{0%{transform:rotate(0)}25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
.run{animation:run .9s cubic-bezier(.2,.8,.2,1) .1s both}
@keyframes run{0%{stroke-dashoffset:120}100%{stroke-dashoffset:0}}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1) .8s both}
@keyframes pop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
.sonar{animation:sonar 1.1s ease-out both}
.sonar2{animation:sonar 1.1s ease-out .35s both}
@keyframes sonar{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1);opacity:0}}
.swim{animation:swim 2.6s ease-in-out both}
.swim2{animation:swim2 2.6s ease-in-out .2s both}
@keyframes swim{0%{transform:translateX(-40px);opacity:0}20%{opacity:.55}100%{transform:translateX(60px);opacity:.55}}
@keyframes swim2{0%{transform:translateX(40px) scaleX(-1);opacity:0}20%{opacity:.4}100%{transform:translateX(-50px) scaleX(-1);opacity:.4}}
@media (prefers-reduced-motion: reduce){.swim,.swim2{animation:none;opacity:.45}.sonar,.sonar2{animation:none;opacity:.35}.token{transition:none}.glow,.reveal,.whale,.ripple,.scan,.away,.tip,.wobble,.run,.pop{animation:none}}
</style>
<script>window.DC_PROPS = {"$preview":{"width":1440,"height":900}};</script>
<script src="./dc-shim.js"></script>
<script>
window.Component = class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'calm', step: 0 }; this._t = null; }
  componentDidMount() { this._d = setTimeout(() => this.run('calm'), 900); }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); if (this._d) clearTimeout(this._d); }
  run(id) {
    if (this._t) clearTimeout(this._t);
    this.setState({ sel: id, step: 0 });
    const tick = () => {
      const cur = this.data().find((x) => x.id === this.state.sel);
      const s = this.state.step + 1;
      this.setState({ step: s });
      if (s <= cur.stop) this._t = setTimeout(tick, s === 4 ? 1800 : 950);
      else this._t = null;
    };
    this._t = setTimeout(tick, 400);
  }
  data() {
    return [
      { id: 'eth', title: 'SEC delays the spot ETH ETF decision again', meta: '14:20 · 3 min after release', asset: 'ETH', side: 'Short', stop: 6, drop: false, reached: 'Short ETH · paper trade',
        ctx: { h1: 'yes', h1tag: '2 whales · +$1.4M Short', h2: 1, h2tag: 'Funding p92 · longs pay', h3: 0, h3tag: '+0.1% before · on time', dir: 'down' },
        notes: ['136 articles', 'ETH-USD', 'ETF delayed → Short', '', 'checks passed', 'Short 500 USDC'],
        texts: ['Seen 3 min after release from Reuters.', 'ETH matched to ETH-USD, new story.', 'Claude: ETF delayed, asset ETH. Level Medium.', 'Whales: 2 tracked wallets added Short ETH in 60 min ($1.4M). Funding 92nd percentile, longs pay. Price moved 0.1% before entry: on time.', 'Price fresh, take profit 1.4% vs 0.2% cost, no open ETH trade.', 'Short ETH-USD 500 USDC, TP 1.4%, SL 0.7%, max hold 2 d.'] },
      { id: 'sol', title: 'Exchange lists Q token for spot trading', meta: '11:02 · 6 min after release', asset: 'Q', side: 'Long', stop: 6, drop: false, reached: 'Long Q · paper trade',
        ctx: { h1: 'no', h1tag: '12 wallets checked · quiet', h2: 0, h2tag: 'Funding p56 · no crowd', h3: 1, h3tag: 'Ran +1.1% before · late?', dir: 'up' },
        notes: ['136 articles', 'Q-USD', 'Listing → Long', '', 'checks passed', 'Long 500 USDC'],
        texts: ['Seen 6 min after release from the exchange notice.', 'Q matched to Q-USD, new story.', 'Claude: listing on a major exchange, asset Q. Level Low.', 'Whales: none of 12 tracked wallets traded Q in 60 min. Funding 56th percentile, no crowd. Price already ran 1.1% up before entry (typical 1 h move 0.8%): flagged late.', 'Price fresh, take profit 2.0% vs 0.2% cost.', 'Long Q-USD 500 USDC, max hold 1 d.'] },
      { id: 'meta', title: 'Meta guides revenue above estimates', meta: '13:16 · 4 min after release', asset: 'META', side: 'Long', stop: 6, drop: false, reached: 'Long META · paper trade',
        ctx: { h1: 'na', h1tag: 'No whale data for META', h2: 0, h2tag: 'Funding p40 · no crowd', h3: 0, h3tag: '+0.2% before · on time', dir: 'up' },
        notes: ['136 articles', 'META-USD', 'Earnings beat → Long', '', 'checks passed', 'Long 500 USDC'],
        texts: ['Seen 4 min after release from the company.', 'META matched to META-USD (stock), new story.', 'Claude: company raised its own guidance, asset META. Level Medium.', 'Whales: META is not on Hyperliquid, not available, left out of the whale comparison. Funding 40th percentile. Price on time.', 'Price fresh, take profit 1.8% vs 0.2% cost.', 'Long META-USD 500 USDC, max hold 3 d.'] },
      { id: 'calm', title: 'Coinbase lists a SOL staking product', meta: '12:40 · 5 min after release', asset: 'SOL', side: 'Long', stop: 6, drop: false, reached: 'Long SOL · paper trade',
        ctx: { h1: 'no', h1tag: '12 wallets checked · quiet', h2: 0, h2tag: 'Funding p48 · no crowd', h3: 0, h3tag: '+0.1% before · on time', dir: 'up' },
        notes: ['136 articles', 'SOL-USD', 'Listing → Long', '', 'checks passed', 'Long 500 USDC'],
        texts: ['Seen 5 min after release.', 'SOL matched to SOL-USD, new story.', 'Claude: listing, asset SOL. Level Low.', 'All three No: no tracked wallet traded SOL in 60 min, funding 48th percentile, price moved 0.1% before entry. The trade still opens; it goes in the "without" group of each question.', 'Price fresh, take profit 1.6% vs 0.2% cost.', 'Long SOL-USD 500 USDC, max hold 1 d.'] },
      { id: 'kntq', title: 'Bithumb will list the KNTQ/KRW pair', meta: '10:01 · 3 min after release', asset: 'KNTQ', side: '', stop: 2, drop: true, reached: 'Dropped at Normalize',
        ctx: null, notes: ['136 articles', 'not on SoDEX', '', '', '', ''],
        texts: ['Seen 3 min after release.', 'KNTQ has no SoDEX market, so the article stops here. Context is never checked.', '', '', '', ''] }
    ];
  }
  renderVals() {
    const all = this.data();
    const cur = all.find((x) => x.id === this.state.sel) || all[0];
    const step = this.state.step;
    const names = ['Collect', 'Normalize', 'Score', 'Context', 'Filter', 'Decide'];
    const fills = ['#1d47b8', '#2e62e8', '#7fa2ff', '#ffffff', '#c9d4ff', '#16a05a'];
    const inks = ['#fff', '#fff', '#141a33', '#141a33', '#141a33', '#fff'];
    const widths = [74, 66, 58, 54, 46, 38];
    const ROW = 44, TOP = 2;
    const pos = Math.min(step, cur.stop);
    const finished = step > cur.stop;
    const st = (i) => { const n = i + 1; if (n > cur.stop) return finished ? 'skip' : 'idle'; if (n < pos) return 'pass'; if (n === pos) return step > n ? (n === cur.stop && cur.drop ? 'drop' : 'pass') : 'active'; return 'idle'; };
    const bands = names.map((name, i) => {
      const s = st(i);
      const ctx = i === 3;
      const on = s === 'pass' || s === 'active' || s === 'drop';
      const bg = s === 'drop' ? '#eef1fa' : on ? fills[i] : '#eef1fa';
      const ink = on && s !== 'drop' ? inks[i] : '#5f6684';
      const shape = ctx ? 'border: 2px dashed ' + (on ? '#2e62e8' : '#c9d4ff') + '; border-radius: 6px;' : 'clip-path: polygon(0 0,100% 0,97% 100%,3% 100%);';
      return { label: (i + 1) + ' · ' + name, note: s === 'pass' || s === 'drop' ? (ctx && cur.ctx ? (((cur.ctx.h1 === 'yes') + (cur.ctx.h2 ? 1 : 0) + (cur.ctx.h3 ? 1 : 0)) + ' of 3 yes') : s === 'drop' ? 'Dropped · ' + cur.notes[i] : cur.notes[i]) : '',
        cls: s === 'active' ? 'glow' : '',
        style: 'position: absolute; left: 50%; top: ' + (TOP + i * ROW) + 'px; width: ' + widths[i] + '%; height: 36px; transform: translateX(-50%); box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; font-size: 13px; font-weight: 800; transition: background .3s, color .3s; ' + shape + ' background: ' + bg + '; color: ' + ink };
    });
    const tokTop = pos === 0 ? -40 : TOP + (pos - 1) * ROW + 4;
    const dropped = finished && cur.drop, traded = finished && !cur.drop;
    const token = { label: dropped ? 'Out · ' + cur.asset : traded ? cur.side + ' ' + cur.asset : cur.asset,
      style: 'position: absolute; z-index: 2; top: ' + (dropped ? tokTop + 26 : tokTop) + 'px; left: ' + (dropped ? 'calc(50% + 40px)' : '50%') + '; transform: translateX(-50%)' + (dropped ? ' rotate(-4deg)' : '') + '; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 4px 14px rgba(20,26,51,.25); border: 2px solid ' + (dropped ? '#9aa3c2' : traded ? '#7be0a6' : '#2e62e8') + '; background: ' + (dropped ? '#eef1fa' : traded ? '#16a05a' : '#fff') + '; color: ' + (dropped ? '#3b4262' : traded ? '#fff' : '#141a33') + '; opacity: ' + (step === 0 ? 0 : 1) };
    const atCtx = pos >= 4 && cur.ctx !== null;
    const x = cur.ctx;
    const c = x ? {
      h1yes: x.h1 === 'yes', h1no: x.h1 === 'no', h1against: x.h1 === 'against', h1na: x.h1 === 'na', h1tag: x.h1tag, h1color: x.h1 === 'yes' ? '#1d47b8' : '#3b4262',
      h2cls: x.h2 ? 'tip' : 'wobble', h2angle: x.h2 ? '-8deg' : '0deg', h2tag: x.h2tag, h2color: x.h2 ? '#1d47b8' : '#3b4262',
      h3pre: 'M10 28 L60 26 L110 29 L150 28', h3path: x.dir === 'up' ? (x.h3 ? 'M150 28 L180 14 L210 4' : 'M150 28 L180 26 L210 24') : (x.h3 ? 'M150 28 L180 42 L210 52' : 'M150 28 L180 30 L210 31'),
      h3stroke: x.h3 ? '#b45f06' : '#2e62e8', h3tag: x.h3tag, h3bg: x.h3 ? '#fdebd3' : '#fff', h3color: x.h3 ? '#7a3e00' : '#3b4262'
    } : {};
    const steps = names.map((n, i) => { const s = st(i); const shown = s === 'pass' || s === 'drop';
      return { n: i + 1, name: n, text: cur.texts[i], show: shown && cur.texts[i] !== '', tag: s === 'drop' ? 'Dropped' : i === 3 ? 'Recorded' : 'Passed',
        style: 'border: 1px solid ' + (i === 3 ? '#2e62e8' : '#e3e7f5') + '; border-radius: 12px; padding: 10px 12px; background: #fff',
        dot: 'width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: ' + inks[i] + '; background: ' + (i === 3 ? '#e6ecfe' : fills[i]),
        tagStyle: 'padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; background: ' + (s === 'drop' ? '#eef1fa' : i === 3 ? '#e6ecfe' : '#ddf4e7') + '; color: ' + (s === 'drop' ? '#3b4262' : i === 3 ? '#1d47b8' : '#0f7a43') }; });
    const items = all.map((it) => ({ ...it, pick: () => this.run(it.id), pressed: String(it.id === cur.id),
      chipStyle: 'display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: ' + (it.drop ? '#eef1fa' : '#ddf4e7') + '; color: ' + (it.drop ? '#3b4262' : '#0f7a43'),
      cardStyle: 'all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 9px 12px; border-radius: 12px; border: 1px solid ' + (it.id === cur.id ? '#2e62e8' : '#e3e7f5') + '; background: ' + (it.id === cur.id ? '#e6ecfe' : '#fff') }));
    const verdict = !finished ? (pos === 0 ? 'Article arriving…' : 'Step ' + pos + ' · ' + names[pos - 1] + '…') : cur.drop ? 'Stopped at ' + names[cur.stop - 1] + ': ' + cur.notes[cur.stop - 1] : 'Reached Decide: ' + cur.side + ' ' + cur.asset + ' · context recorded';
    return { items, bands, token, steps, verdict, verdictColor: !finished ? '#3b4262' : cur.drop ? '#3b4262' : '#0f7a43',
      ctxShow: atCtx, ctxWaiting: !atCtx, ctxWaitText: cur.ctx === null ? 'This article never reaches step 4, so no context is checked.' : 'Waiting for the article to reach step 4…',
      ctxBorder: atCtx ? '#2e62e8' : '#c9d4ff', c, replay: () => this.run(cur.id) };
  }
}

</script>
</head>
<body>
<template id="dc-tpl">

<div style="box-sizing: border-box; width: 100%; max-width: 1440px; margin: 0 auto; padding: 24px; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; color: #141a33; display: flex; flex-direction: column; gap: 14px">
  <section style="background: #fff; border: 1px solid #e3e7f5; border-radius: 18px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
      <div>
        <h2 style="margin: 0; font-size: 20px; font-weight: 800">From headline to trade</h2>
        <p style="margin: 2px 0 0; font-size: 13px; color: #5f6684">Every article, what happened to it, and why. Pick one to watch it go through.</p>
      </div>
      <button type="button" onClick="{{replay}}" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #2e62e8; background: #2e62e8; color: #fff; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Replay</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch">
      <div style="grid-column: span 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-size: 13px"><strong>News feed</strong><span style="color: #5f6684">5 of 136 articles</span></div>
        <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
          <button type="button" class="news" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" style="{{it.cardStyle}}">
            <span style="display: block; font-size: 12px; color: #5f6684">{{it.meta}}</span>
            <span style="display: block; font-size: 14px; font-weight: 700; color: #141a33; margin: 3px 0 5px">{{it.title}}</span>
            <span style="{{it.chipStyle}}">{{it.reached}}</span>
          </button>
        </sc-for>
      </div>

      <div style="grid-column: span 2; min-width: 0; display: flex; gap: 12px; align-items: stretch">
        <div style="flex: 1 1 auto; min-width: 0; background: #f5f7fd; border: 1px solid #e3e7f5; border-radius: 14px; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px">
          <div aria-hidden="true" style="position: relative; height: 270px">
            <sc-for list="{{bands}}" as="b" hint-placeholder-count="6">
              <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0">
                <div class="{{b.cls}}" style="{{b.style}}"><span>{{b.label}}</span><span style="font-weight: 700">{{b.note}}</span></div>
              </div>
            </sc-for>
            <div class="token" style="{{token.style}}">{{token.label}}</div>
          </div>
          <p role="status" style="margin: 0; text-align: center; font-size: 13px; font-weight: 800; color: {{verdictColor}}">{{verdict}}</p>
        </div>

        <div style="flex: 0 0 300px; min-width: 0; background: #fff; border: 2px dashed {{ctxBorder}}; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 13px">4 · Context</strong><span style="font-size: 11px; font-weight: 700; color: #5f6684">records only</span></div>
          <sc-if value="{{ctxWaiting}}" hint-placeholder-val="{{false}}">
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: #5f6684; padding: 12px">{{ctxWaitText}}</div>
          </sc-if>
          <sc-if value="{{ctxShow}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <div style="position: relative; height: 70px; border-radius: 10px; overflow: hidden; background: #e6ecfe">
                <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #c9d4ff"></div>
                <sc-if value="{{c.h1yes}}" hint-placeholder-val="{{false}}">
                  <div style="position: absolute; inset: 0">
                    <div class="ripple" style="position: absolute; left: 50%; top: 50px; width: 40px; height: 10px; margin-left: -20px; border: 2px solid #2e62e8; border-radius: 50%"></div>
                    <svg class="whale" width="70" height="40" viewBox="0 0 120 70" style="position: absolute; left: 50%; top: 18px; margin-left: -35px"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#1d47b8"></path><circle cx="34" cy="36" r="3" fill="#fff"></circle><path d="M44 18c-2-6 0-12 4-14M44 18c0-7 4-11 9-12M44 18c2-6 7-8 12-7" stroke="#7fa2ff" stroke-width="3" fill="none" stroke-linecap="round"></path></svg>
                  </div>
                </sc-if>
                <sc-if value="{{c.h1no}}" hint-placeholder-val="{{false}}">
                  <div style="position: absolute; inset: 0"><div class="scan" style="position: absolute; top: 0; bottom: 0; width: 60px; background: linear-gradient(90deg, rgba(46,98,232,0), rgba(46,98,232,.25), rgba(46,98,232,0))"></div><svg class="swim" width="30" height="18" viewBox="0 0 120 70" style="position: absolute; left: 18%; top: 52px"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#2e62e8"></path></svg><svg class="swim2" width="24" height="14" viewBox="0 0 120 70" style="position: absolute; left: 64%; top: 56px"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#2e62e8"></path></svg><div class="sonar" style="position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border: 2px solid #2e62e8; border-radius: 50%"></div><div class="sonar2" style="position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border: 2px solid #2e62e8; border-radius: 50%"></div><div style="position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #2e62e8"></div></div>
                </sc-if>
                <sc-if value="{{c.h1against}}" hint-placeholder-val="{{false}}">
                  <svg class="away" width="70" height="40" viewBox="0 0 120 70" style="position: absolute; left: 50%; top: 24px; margin-left: -35px"><g transform="translate(120 0) scale(-1 1)"><path d="M10 40c10-18 40-26 66-18 10 3 18 8 24 14l12-12-2 18 8 10-14-4c-10 12-30 18-50 16C24 62 6 54 10 40z" fill="#5f6684"></path></g></svg>
                </sc-if>
                <sc-if value="{{c.h1na}}" hint-placeholder-val="{{false}}">
                  <div style="position: absolute; inset: 6px; border: 2px dashed #d5dcf2; border-radius: 8px; background: #f5f7fd"></div>
                </sc-if>
                <span class="pop" style="position: absolute; left: 6px; top: 6px; padding: 2px 8px; border-radius: 999px; background: #fff; font-size: 11px; font-weight: 800; color: {{c.h1color}}">{{c.h1tag}}</span>
              </div>
              <div style="position: relative; height: 56px; border-radius: 10px; overflow: hidden; background: #f5f7fd; border: 1px solid #e3e7f5">
                <div style="position: absolute; left: 50%; bottom: 8px; width: 0; height: 0; margin-left: -8px; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #3b4262"></div>
                <div class="{{c.h2cls}}" style="position: absolute; left: 50%; bottom: 22px; width: 160px; margin-left: -80px; height: 4px; border-radius: 2px; background: #141a33; --tip: {{c.h2angle}}">
                  <div style="position: absolute; left: 2px; bottom: 4px; display: flex; gap: 2px"><span style="width: 8px; height: 12px; border-radius: 4px 4px 1px 1px; background: #a72826"></span><span style="width: 8px; height: 12px; border-radius: 4px 4px 1px 1px; background: #a72826"></span><span style="width: 8px; height: 12px; border-radius: 4px 4px 1px 1px; background: #a72826"></span><span style="width: 8px; height: 12px; border-radius: 4px 4px 1px 1px; background: #a72826"></span></div>
                  <span style="position: absolute; right: 4px; bottom: 4px; width: 10px; height: 14px; border-radius: 5px 5px 1px 1px; background: #2e62e8"></span>
                </div>
                <span class="pop" style="position: absolute; left: 6px; top: 4px; padding: 2px 8px; border-radius: 999px; background: #fff; font-size: 11px; font-weight: 800; color: {{c.h2color}}">{{c.h2tag}}</span>
              </div>
              <div style="position: relative; height: 56px; border-radius: 10px; overflow: hidden; background: #f5f7fd; border: 1px solid #e3e7f5">
                <svg width="100%" height="56" viewBox="0 0 280 56" preserveAspectRatio="none" style="position: absolute; inset: 0"><line x1="210" y1="4" x2="210" y2="52" stroke="#5f6684" stroke-width="2" stroke-dasharray="3 3"></line><path d="{{c.h3pre}}" stroke="#5f6684" stroke-width="3" fill="none" stroke-linecap="round"></path><path class="run" d="{{c.h3path}}" stroke="{{c.h3stroke}}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="0"></path></svg>
                <span class="pop" style="position: absolute; left: 6px; top: 4px; padding: 2px 8px; border-radius: 999px; background: {{c.h3bg}}; font-size: 11px; font-weight: 800; color: {{c.h3color}}">{{c.h3tag}}</span>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <sc-if value="{{s.show}}" hint-placeholder-val="{{true}}">
          <li class="reveal" style="{{s.style}}">
            <div style="display: flex; align-items: center; gap: 8px"><span style="{{s.dot}}">{{s.n}}</span><strong style="flex: 1; font-size: 14px">{{s.name}}</strong><span style="{{s.tagStyle}}">{{s.tag}}</span></div>
            <p style="margin: 6px 0 0; font-size: 12px; color: #3b4262; line-height: 1.5">{{s.text}}</p>
          </li>
        </sc-if>
      </sc-for>
    </ol>
  </section>
</div>
</template>
<div id="dc-root"></div>
</body>
</html>
