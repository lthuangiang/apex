<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace context card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f7fd}
</style>
<script>window.DC_PROPS = {"$preview":{"width":760,"height":880}};</script>
<script src="./dc-shim.js"></script>
<script>
window.Component = class Component extends DCLogic {
  renderVals() { return {}; }
}

</script>
</head>
<body>
<template id="dc-tpl">

<div style="width: 760px; box-sizing: border-box; padding: 24px; font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; color: #141a33; background: #f5f7fd; display: flex; flex-direction: column; gap: 10px">
  <p style="margin: 0; font-size: 13px; color: #5f6684">In the article trace, step 4 · Context sits between Score and Filter. Values were saved at the decision time and never recomputed.</p>
  <article style="border: 1px solid #e3e7f5; border-radius: 14px; padding: 14px 16px; background: #fff; display: flex; align-items: center; gap: 10px">
    <span style="width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; background: #4a7bf0">3</span>
    <span style="flex: 1; font-size: 15px; font-weight: 800">Score</span>
    <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #ddf4e7; color: #0f7a43">Passed</span>
  </article>
  <article style="border: 2px solid #4a7bf0; border-radius: 14px; padding: 16px; background: #fff; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #1d47b8; background: #e6ecfe">4</span>
      <h2 style="margin: 0; flex: 1; font-size: 15px; font-weight: 800">4 · Context at 10:20:14</h2>
      <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #eef1fa; color: #3b4262">Recorded · does not change the trade</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="border: 1px solid #e3e7f5; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; font-weight: 800; color: #5f6684">H1 · Whales agree</div>
        <div style="font-size: 18px; font-weight: 800; color: #0f7a43">Yes</div>
        <div style="font-size: 12px; color: #3b4262; line-height: 1.45">2 research wallets (top 30 of the leaderboard) added Long ETH in the 60 min before · $1.4M · first at 09:41</div>
      </div>
      <div style="border: 1px solid #e3e7f5; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; font-weight: 800; color: #5f6684">H2 · Funding against the crowd</div>
        <div style="font-size: 18px; font-weight: 800; color: #3b4262">No</div>
        <div style="font-size: 12px; color: #3b4262; line-height: 1.45">Funding 0.010% per 8 h · 56th percentile of 30 days · Long needs ≤ 20th</div>
      </div>
      <div style="border: 1px solid #e3e7f5; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; font-weight: 800; color: #5f6684">H3 · Price already moved</div>
        <div style="font-size: 18px; font-weight: 800; color: #3b4262">No</div>
        <div style="font-size: 12px; color: #3b4262; line-height: 1.45">+0.2% before entry · typical 1 h move 0.6% · threshold 0.6%</div>
      </div>
    </div>
    <details style="border-top: 1px solid #eef1fa; padding-top: 8px">
      <summary style="cursor: pointer; font-size: 13px; font-weight: 700; min-height: 32px; display: flex; align-items: center">Exploratory values</summary>
      <dl style="margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
        <div style="display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 12px"><dt style="color: #5f6684">Volume vs 24 h average</dt><dd style="margin: 0; font-weight: 700">1.8×</dd></div>
        <div style="display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 12px"><dt style="color: #5f6684">Range breakout</dt><dd style="margin: 0; font-weight: 700">No</dd></div>
        <div style="display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 12px"><dt style="color: #5f6684">Open interest</dt><dd style="margin: 0; font-weight: 700">Not available</dd></div>
      </dl>
    </details>
  </article>
  <article style="border: 1px solid #e3e7f5; border-radius: 14px; padding: 14px 16px; background: #fff; display: flex; align-items: center; gap: 10px">
    <span style="width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; background: #16a05a">5</span>
    <span style="flex: 1; font-size: 15px; font-weight: 800">Filter</span>
    <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #ddf4e7; color: #0f7a43">Passed</span>
  </article>
  <p style="margin: 0; font-size: 12px; color: #5f6684">Backfilled signals show the same card with a "Backfilled" tag instead of "Recorded", built only from data stamped before the decision.</p>
</div>
</template>
<div id="dc-root"></div>
</body>
</html>
