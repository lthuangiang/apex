# Release (docs/RELEASE.md): push tag `vX.Y.Z` trên main → kiểm tra CI của commit đó đã xanh → build 10 image
# `linux/amd64` song song → push Docker Hub `<DRIFT_IMAGE>:<app>-<tag>` (+ `<app>-latest`) → tạo GitHub Release.
# Không deploy: người dùng tự chạy `infra/deploy/build-push.sh --deploy-only <tag>` (tiền thật trên mainnet).
name: release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main"; exit 1; }
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$GITHUB_SHA" \
            --json conclusion,event --jq '[.[] | select(.event == "push")][0].conclusion')"
          echo "ci on $GITHUB_SHA: ${conclusion:-none}"
          [ "$conclusion" = "success" ] || {
            echo "::error::CI has not passed on $GITHUB_SHA (got: ${conclusion:-no run})"; exit 1; }

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [api, backtest, engine, jobs, marketdata, realtime, reco, scheduler, signer, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ vars.PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ vars.DRIFT_IMAGE }}:${{ matrix.app }}-${{ github.ref_name }}
            ${{ vars.DRIFT_IMAGE }}:${{ matrix.app }}-latest
          build-args: |
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ vars.WALLETCONNECT_PROJECT_ID }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Images: \`${{ vars.DRIFT_IMAGE }}:<app>-${GITHUB_REF_NAME}\` (10 apps).
          Deploy: \`infra/deploy/build-push.sh --deploy-only ${GITHUB_REF_NAME}\`"
