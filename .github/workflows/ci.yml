# Thứ tự theo CODING_STANDARDS C15: install → lint → typecheck → unit → integration → build → e2e.
# Mọi bước vẫn chạy trên mọi PR, nhưng tách thành các job song song (repo public: phút Actions miễn phí)
# thay vì nối tiếp trên một runner 2 vCPU (~15.5 phút):
#   lint    ESLint có kiểm tra kiểu, có cache ESLint (PR dùng cache; push lên main lint lại toàn bộ).
#   static  format:check + typecheck.
#   test    unit + integration (Testcontainers), chia 3 shard theo package cho cân thời gian.
#   ui      Playwright a11y trên Storybook + build.
#   compose dựng hạ tầng docker compose.
#   check   gom kết quả: fail nếu job nào fail / bị huỷ. Dùng làm tên duy nhất khi bật "Require status checks".
# Typecheck và test dùng cache Turbo (.turbo/cache) lưu theo sha, khôi phục từ lần chạy gần nhất của nhánh
# (rồi của main): package không đổi thì cache hit. Shard test KHÔNG dùng `--only` (#414, DEC-358):
# `--only` bỏ `dependsOn`, nên hash test của engine / backtest không tính `@drift/strategies` và PR đổi strategies chỉ
# phát lại log cũ. Không có `--only`, test phụ thuộc `^typecheck` (turbo.json): hash test gồm hash typecheck của mọi
# package nó dùng (bắc cầu), nên đổi một package thì test của nó và của mọi package dùng nó chạy lại; PR chỉ đổi docs
# vẫn cache hit. Typecheck của dependency chạy lại trong shard khi cache miss (vài chục giây).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Cache ESLint theo nội dung file. Lint có kiểm tra kiểu: file không đổi nhưng kiểu nó import đổi thì
      # cache không biết, nên push lên main bỏ cache và lint lại toàn bộ (rồi lưu cache mới cho các PR sau).
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'tsconfig.base.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'tsconfig.base.json') }}-
      - if: github.event_name == 'push'
        run: rm -rf node_modules/.cache/eslint
      # ESLint có kiểm tra kiểu trên cả repo: mặc định ~4 GB heap không còn đủ (#98 hết bộ nhớ). 6 GB cũng hết khi
      # lint lại toàn bộ trên main sau gói US Market (2026-11-28, hai lần liên tiếp); runner có 16 GB nên nâng lên 10 GB.
      - run: pnpm lint --cache --cache-strategy content --cache-location node_modules/.cache/eslint/
        env:
          NODE_OPTIONS: --max-old-space-size=10240

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chia theo thời gian test đo ở run 44018826746: api ~210s; engine+scheduler+backtest ~205s; còn lại ~210s.
        # Thêm package mới thì nó tự vào shard "rest".
        include:
          - shard: api
            filter: --filter=@drift/api
          - shard: engine
            filter: --filter=@drift/engine --filter=@drift/scheduler --filter=@drift/backtest
          - shard: rest
            filter: --filter=!@drift/api --filter=!@drift/engine --filter=!@drift/scheduler --filter=!@drift/backtest
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-test-${{ matrix.shard }}-
      # Runner 2 vCPU: tối đa 2 package test cùng lúc để test UI không hết giờ vì bị chia CPU (#21, #24, #25).
      # Không `--only` (#414): hash test phải tính cả package phụ thuộc (qua `^typecheck`).
      - run: pnpm exec turbo run test --concurrency=2 ${{ matrix.filter }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @drift/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @drift/ui test:a11y
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      - run: pnpm build
      # Chunk tĩnh của web ai cũng tải được: fail nếu logic bước của chiến lược / ngưỡng engine đề xuất lọt vào.
      - run: pnpm --filter @drift/web check:bundle

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Postgres chạy 01-signer-role.sh lúc khởi tạo: thiếu SIGNER_DB_PASSWORD thì script thoát lỗi và Postgres unhealthy.
      - run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only/" .env
          sed -i "s/^SIGNER_DB_PASSWORD=$/SIGNER_DB_PASSWORD=ci-only-signer/" .env
      # `--wait` coi container chạy một lần đã thoát (vault-init, exit 0) là lỗi: chờ mọi service còn lại healthy,
      # rồi chạy vault-init riêng và bắt buộc nó thoát với mã 0.
      - run: docker compose --profile dev up -d --wait $(docker compose --profile dev config --services | grep -vx vault-init)
      - run: |
          docker compose --profile dev up -d vault-init
          code=$(docker wait "$(docker compose --profile dev ps -aq vault-init)")
          docker compose --profile dev logs vault-init
          echo "vault-init exit code: $code"
          test "$code" = "0"
      - if: always()
        run: docker compose --profile dev down -v

  check:
    if: always()
    needs: [lint, static, test, ui, compose]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do test "$r" = "success" || exit 1; done
