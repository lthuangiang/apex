# Thứ tự theo CODING_STANDARDS C15: install → lint → typecheck → unit → integration → build → e2e.
# Integration và e2e được thêm khi có app (P3 trở đi).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm i -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @drift/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @drift/ui test:a11y
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Postgres chạy 01-signer-role.sh lúc khởi tạo: thiếu SIGNER_DB_PASSWORD thì script thoát lỗi và Postgres unhealthy.
      - run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only/" .env
          sed -i "s/^SIGNER_DB_PASSWORD=$/SIGNER_DB_PASSWORD=ci-only-signer/" .env
      # `--wait` coi container chạy một lần đã thoát (vault-init, exit 0) là lỗi: chờ mọi service còn lại healthy,
      # rồi chạy vault-init riêng và bắt buộc nó thoát với mã 0.
      - run: docker compose --profile dev up -d --wait $(docker compose --profile dev config --services | grep -vx vault-init)
      - run: |
          docker compose --profile dev up -d vault-init
          code=$(docker wait "$(docker compose --profile dev ps -aq vault-init)")
          docker compose --profile dev logs vault-init
          echo "vault-init exit code: $code"
          test "$code" = "0"
      - if: always()
        run: docker compose --profile dev down -v
